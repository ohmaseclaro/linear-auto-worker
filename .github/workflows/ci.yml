name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The daemon is macOS-first (ngrok's config path and the SIGINT process-group behaviour
    # were both measured there), but nothing in `verify` is platform-specific: it needs no
    # credentials, no network and no Linear workspace. Running both catches anything that
    # quietly depended on the author's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22 is the floor declared in `engines`; 24 is Active LTS and what the setup wizard
        # recommends. Both are tested because the project supports both.
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    name: verify (node ${{ matrix.node }}, ${{ matrix.os }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` and not `npm install`: the lockfile is the point. `better-sqlite3` and
      # `@ngrok/ngrok` both resolve prebuilt native binaries here — if either ever needs to
      # compile, this step is where it will show up rather than in a contributor's clone.
      - run: npm ci

      # The single canonical gate: clean, tsc, copy non-TS assets, every test, boot smoke.
      # Identical to what a contributor runs locally — see CONTRIBUTING.md.
      #
      # Deliberately NO `GH_TOKEN` / `gh auth` step, and deliberately no Linear or ngrok
      # credentials. `bootDaemon` runs a real preflight that shells out to `gh auth status`,
      # so an unauthenticated runner is what keeps every test honest about injecting its own
      # tool runner. The first CI run here failed 14 tests for exactly that reason while the
      # same commit passed locally (TRAPS T91). Adding credentials would make those tests
      # pass again without fixing anything — do not.
      - run: npm run verify
